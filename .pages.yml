        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: tags_fa
        label: Tags (Persian)
        type: string
        list: true
      - name: excerpt_en
        label: Summary (English)
        type: text
      - name: excerpt_fa
        label: Summary (Persian)
        type: text
      - name: body_en
        label: Article body (English)
        type: rich-text
      - name: body_fa
        label: Article body (Persian)
        type: rich-text
      - name: cover_image
        label: Featured image
        type: image
        options:
          media: images
      - name: image_alt
        label: Featured image alternative text
        type: string
      - name: gallery
        label: Additional images
        type: image
        list: true
