media:
  - name: images
    label: Images
    input: media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: documents
    label: Documents
    input: media/documents
    output: /media/documents
    rename: safe
    categories: [document]
  - name: audio
    label: Audio
    input: media/audio
    output: /media/audio
    rename: safe
    categories: [audio]
content:
  - name: sections
    label: Website Sections & Tabs
    type: collection
    path: content/sections
    format: json
    filename: "{slug}.json"
    view:
      primary: label_en
      sort: order
      order: asc
    fields:
      - name: name
        label: Internal name
        type: string
        required: true
      - name: slug
        label: Section ID / slug
        type: string
        required: true
      - name: label_en
        label: English tab title
        type: string
        required: true
      - name: label_fa
        label: Persian tab title
        type: string
      - name: description_en
        label: English description
        type: text
      - name: description_fa
        label: Persian description
        type: text
      - name: order
        label: Menu order
        type: number
      - name: visible
        label: Show in website navigation
        type: boolean
      - name: layout
        label: Content layout
        type: select
        options:
          values: [article-list, portfolio-grid, photo-gallery, video-gallery, mixed]
      - name: columns_desktop
        label: Grid columns — desktop (1–6)
        type: number
      - name: columns_tablet
        label: Grid columns — tablet (1–4)
        type: number
      - name: columns_mobile
        label: Grid columns — mobile (1–2)
        type: number
      - name: grid_gap
        label: Grid gap (px, 8–32)
        type: number
      - name: content_width
        label: Section content width (px)
        type: number
      - name: padding_top
        label: Section top spacing (px)
        type: number
      - name: padding_bottom
        label: Section bottom spacing (px)
        type: number
      - name: card_min_width
        label: Minimum card width (px)
        type: number
      - name: image_ratio
        label: Image aspect ratio
        type: select
        options:
          values: ["16/9", "4/3", "1/1", "3/4", "auto"]
  - name: posts
    label: News & Articles
    type: collection
    path: content/posts
    format: json
    filename: "{slug}.json"
    view:
      primary: title_en
      sort: order
      order: desc
    fields:
      - name: title_en
        label: Headline (English)
