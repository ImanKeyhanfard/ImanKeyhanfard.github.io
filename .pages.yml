media:
  - name: images
    label: Images
    input: media/images
    output: /media/images
    rename: safe
    categories: [image]
  - name: documents
    label: Documents
    input: media/documents
    output: /media/documents
    rename: safe
    categories: [document]
  - name: audio
    label: Audio
    input: media/audio
    output: /media/audio
    rename: safe
    categories: [audio]
content:
  - name: sections
    label: Website Sections & Tabs
    type: collection
    path: content/sections
    format: json
    filename: "{slug}.json"
    view:
      primary: label_en
      sort: order
      order: asc
    fields:
      - name: name
        label: Internal name
        type: string
        required: true
      - name: slug
        label: Section ID / slug
        type: string
        required: true
      - name: label_en
        label: English tab title
        type: string
        required: true
      - name: label_fa
        label: Persian tab title
        type: string
      - name: description_en
        label: English description
        type: text
      - name: description_fa
        label: Persian description
        type: text
      - name: order
        label: Menu order
        type: number
      - name: visible
        label: Show in website navigation
        type: boolean
      - name: layout
        label: Content layout
        type: select
        options:
          values: [article-list, portfolio-grid, photo-gallery, video-gallery, mixed]
      - name: columns_desktop
        label: Grid columns — desktop (1–6)
        type: number
      - name: columns_tablet
        label: Grid columns — tablet (1–4)
        type: number
      - name: columns_mobile
        label: Grid columns — mobile (1–2)
        type: number
      - name: grid_gap
        label: Grid gap (px, 8–32)
        type: number
      - name: content_width
        label: Section content width (px)
        type: number
      - name: padding_top
        label: Section top spacing (px)
        type: number
      - name: padding_bottom
        label: Section bottom spacing (px)
        type: number
      - name: card_min_width
        label: Minimum card width (px)
        type: number
      - name: image_ratio
        label: Image aspect ratio
        type: select
        options:
          values: ["16/9", "4/3", "1/1", "3/4", "auto"]
  - name: posts
    label: News & Articles
    type: collection
    path: content/posts
    format: json
    filename: "{slug}.json"
    view:
      primary: title_en
      sort: publication_date
      order: desc
    fields:
      - name: title_en
        label: Headline (English)
        type: string
        required: true
      - name: title_fa
        label: Headline (Persian)
        type: string
      - name: subtitle_en
        label: Subtitle (English)
        type: text
      - name: subtitle_fa
        label: Subtitle (Persian)
        type: text
      - name: slug
        label: URL slug
        type: string
        required: true
      - name: section
        label: Section slug
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: excerpt_en
        label: Summary (English)
        type: text
      - name: excerpt_fa
        label: Summary (Persian)
        type: text
      - name: body_en
        label: Article body (English)
        type: rich-text
      - name: body_fa
        label: Article body (Persian)
        type: rich-text
      - name: cover_image
        label: Featured image
        type: image
        options:
          media: images
      - name: image_alt
        label: Featured image alternative text
        type: string
      - name: gallery
        label: Additional images
        type: image
        list: true
        options:
          media: images
      - name: audio_file
        label: Audio file
        type: file
        options:
          media: audio
      - name: video_url
        label: Video URL (YouTube / Vimeo / other host)
        type: string
      - name: source_url
        label: Original source URL
        type: string
      - name: author
        label: Byline
        type: string
      - name: publication_date
        label: Publication date
        type: date
        time: true
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: order
        label: Manual display order / priority
        type: number
      - name: status
        label: Publication status
        type: select
        options:
          values: [draft, published]
  - name: portfolio
    label: Portfolio & Media Projects
    type: collection
    path: content/portfolio
    format: json
    filename: "{slug}.json"
    view:
      primary: title_en
      sort: order
      order: asc
    fields:
      - name: title_en
        label: Project title (English)
        type: string
        required: true
      - name: title_fa
        label: Project title (Persian)
        type: string
      - name: slug
        label: Project slug
        type: string
        required: true
      - name: section
        label: Section slug
        type: string
      - name: project_type
        label: Media type
        type: select
        options:
          values: [video, photo, article, interview, audio, research, translation, other, "LinkedIn post"]
      - name: role_en
        label: My role (English)
        type: text
      - name: role_fa
        label: My role (Persian)
        type: text
      - name: description_en
        label: Description (English)
        type: rich-text
      - name: description_fa
        label: Description (Persian)
        type: rich-text
      - name: thumbnail
        label: Cover image
        type: image
        options:
          media: images
      - name: image_alt
        label: Cover image alternative text
        type: string
      - name: gallery
        label: Photo gallery
        type: image
        list: true
        options:
          media: images
      - name: video_url
        label: Video URL
        type: string
      - name: original_url
        label: Original publication / source URL
        type: string
      - name: date
        label: Project date
        type: date
      - name: tags
        label: Tags
        type: string
        list: true
      - name: order
        label: Display order
        type: number
      - name: featured
        label: Feature on homepage
        type: boolean
      - name: status
        label: Publication status
        type: select
        options:
          values: [draft, published]
  - name: experience
    label: Professional Experience
    type: collection
    path: content/experience
    format: json
    filename: "{primary}.json"
    view:
      primary: organization_en
      sort: order
      order: asc
    fields:
      - name: organization_en
        label: Organization (English)
        type: string
        required: true
      - name: organization_fa
        label: Organization (Persian)
        type: string
      - name: role_en
        label: Role (English)
        type: string
      - name: role_fa
        label: Role (Persian)
        type: string
      - name: period
        label: Period
        type: string
      - name: description_en
        label: Description (English)
        type: rich-text
      - name: description_fa
        label: Description (Persian)
        type: rich-text
      - name: capabilities_en
        label: Capabilities (English)
        type: string
        list: true
      - name: capabilities_fa
        label: Capabilities (Persian)
        type: string
        list: true
      - name: tab_en
        label: Experience tab label (English)
        type: string
      - name: tab_fa
        label: Experience tab label (Persian)
        type: string
      - name: image
        label: Experience image
        type: image
        options:
          media: images
      - name: image_alt
        label: Image alternative text
        type: string
      - name: image_caption
        label: Image caption
        type: string
      - name: client_value_en
        label: Client value (English)
        type: text
      - name: client_value_fa
        label: Client value (Persian)
        type: text
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Visible on website
        type: boolean
  - name: services
    label: Services
    type: collection
    path: content/services
    format: json
    filename: "{slug}.json"
    view:
      primary: title_en
      sort: order
      order: asc
    fields:
      - name: title_en
        label: Service title (English)
        type: string
        required: true
      - name: title_fa
        label: Service title (Persian)
        type: string
      - name: slug
        label: Service ID
        type: string
        required: true
      - name: intro_en
        label: Introduction (English)
        type: text
      - name: intro_fa
        label: Introduction (Persian)
        type: text
      - name: details_en
        label: Service details (English)
        type: string
        list: true
      - name: details_fa
        label: Service details (Persian)
        type: string
        list: true
      - name: tab_en
        label: Service tab label (English)
        type: string
      - name: tab_fa
        label: Service tab label (Persian)
        type: string
      - name: delivery_en
        label: Deliverables (English)
        type: text
      - name: delivery_fa
        label: Deliverables (Persian)
        type: text
      - name: image
        label: Service image
        type: image
        options:
          media: images
      - name: image_alt
        label: Image alternative text
        type: string
      - name: icon
        label: Icon name
        type: string
      - name: order
        label: Display order
        type: number
      - name: visible
        label: Visible on website
        type: boolean
  - name: site_settings
    label: Website Settings & Contact
    type: file
    path: content/site-settings.json
    format: json
    fields:
      - name: site_title
        label: Website title
        type: string
      - name: tagline_en
        label: English tagline
        type: text
      - name: tagline_fa
        label: Persian tagline
        type: text
      - name: email
        label: Contact email
        type: string
      - name: phone
        label: Contact phone
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: whatsapp
        label: WhatsApp URL
        type: string
      - name: profile_image
        label: Profile image
        type: image
        options:
          media: images
      - name: contact_image
        label: Contact section image
        type: image
        options:
          media: images
      - name: layout_page_gutter
        label: Page side spacing (vw, 3–12)
        type: number
      - name: layout_card_radius
        label: Card corner radius (px, 0–24)
        type: number
      - name: layout_grid_gap
        label: Grid spacing (px, 8–32)
        type: number
      - name: seo_description_en
        label: SEO description (English)
        type: text
      - name: seo_description_fa
        label: SEO description (Persian)
        type: text
      - name: seo_title_en
        label: SEO title (English)
        type: string
      - name: seo_title_fa
        label: SEO title (Persian)
        type: string
      - name: seo_keywords_en
        label: SEO keywords (English)
        type: string
      - name: seo_keywords_fa
        label: SEO keywords (Persian)
        type: string
      - name: seo_og_image
        label: Social sharing image URL or path
        type: string
      - name: layout_content_width
        label: Main content maximum width (px, 900–1800)
        type: number
      - name: layout_section_gap
        label: Section spacing (px, 8–64)
        type: number
      - name: layout_card_min_width
        label: Content card minimum width (px, 180–340)
        type: number
  - name: page_seo
    label: Individual Page SEO
    type: collection
    path: content/seo-pages
    format: json
    filename: "{slug}.json"
    view:
      primary: slug
      sort: slug
      order: asc
    fields:
      - name: slug
        label: File ID
        type: string
        required: true
      - name: page_path
        label: Website page path
        type: string
        required: true
      - name: title_en
        label: SEO title (English)
        type: string
      - name: title_fa
        label: SEO title (Persian)
        type: string
      - name: description_en
        label: Meta description (English)
        type: text
      - name: description_fa
        label: Meta description (Persian)
        type: text
      - name: keywords_en
        label: Keywords (English)
        type: text
      - name: keywords_fa
        label: Keywords (Persian)
        type: text
      - name: canonical_url
        label: Canonical URL
        type: string
      - name: alternate_en
        label: English language equivalent URL
        type: string
      - name: alternate_fa
        label: Persian language equivalent URL
        type: string
      - name: og_image
        label: Social sharing image URL or path
        type: string
      - name: noindex
        label: Hide page from search engines
        type: boolean
settings:
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"