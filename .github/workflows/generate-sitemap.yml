name: Generate sitemap from CMS SEO records

on:
  push:
    paths:
      - "content/seo-pages/*.json"
      - "scripts/generate_sitemap.py"
      - ".github/workflows/generate-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate sitemap
        run: python scripts/generate_sitemap.py
      - name: Commit sitemap when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore(seo): regenerate sitemap from CMS pages"
          git push
