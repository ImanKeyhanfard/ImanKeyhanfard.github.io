name: Export LinkedIn archive to CMS
on:
  push:
    paths:
      - "scripts/export_linkedin_archive_preview.py"
      - ".github/workflows/archive-export-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Export archive posts and compile index
        run: python scripts/export_linkedin_archive_preview.py
      - name: Commit CMS archive records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/archive-posts archive-posts.json
          git commit -m "Export LinkedIn archive into editable CMS records" || exit 0
          git push
