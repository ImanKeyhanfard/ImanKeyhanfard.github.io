name: Inspect LinkedIn archive export
on:
  push:
    paths:
      - "linkedin-archive.html"
      - "scripts/export_linkedin_archive_preview.py"
      - ".github/workflows/archive-export-preview.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Decode archive and write preview
        run: python scripts/export_linkedin_archive_preview.py
      - name: Commit preview summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive-export-preview.json
          git commit -m "Inspect LinkedIn archive export structure" || exit 0
          git push
